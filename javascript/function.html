<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>function</title>
</head>
<body>
    <p id="hasil"></p>
    <script>
        function hitung(op, x, y) {
            if (op === '-') {
                return x - y;

            } else if (op === '+'){
                return x + y ;
            } else if (op === 'x'){
                return x * y ;
            } else if (op === '/'){
                if x / y ;{
                    return "y tidak boleh nol";
                }
                return x / y;
            } else if (op === '%'){
                if (y === 0) {
                    return "y tidak boleh nol";
                }
                return x % y;
            }
        }
        
        document.getElementById("hasil").innerHTML = hitung(5,7)
    </script>
</body>
</html>
