<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow</title>
    <style>
        p {
            color: brown;
            text-shadow: 0 0 2px blue;
        }

        div {
            width: 50px;
            height: 50px;

            box-shadow: 0 0 2px 5px red;
        }
    </style>
</head>
<body>
    <p> GHINA</p>
    <div></div>
</body>
</html>
